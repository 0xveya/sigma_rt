[tools]
"conda:clang" = "latest"
"github:xmake-io/xmake" = "latest"
clang-format = "latest"
"conda:cppcheck" = "latest"
"conda:bear" = "latest"

[tasks.build]
description = "compile sigma_rt"
run = "xmake f -m release -y && xmake -y"

[tasks.dev]
description = "compile sigma_rt in debug mode"
run = "xmake f -m debug -y && xmake -y"

[tasks.test]
description = "run sigma_rt tests"
run = "xmake test -vD"

[tasks.run]
description = "build and run sigma_rt"
run = "xmake run sigma-rt-app"

[tasks.compiledb]
description = "generate compile_commands.json"
run = "xmake project -k compile_commands ."

[tasks.check]
description = "run static analysis"
run = "cppcheck --enable=all --suppress=missingIncludeSystem main.c src/*.c"

[tasks.format]
description = "format C sources and headers"
run = "clang-format -i main.c src/*.c include/*.h include/sigma/*.h"

[tasks.clean]
description = "remove build artifacts"
run = "xmake clean -a && rm -rf build compile_commands.json"
